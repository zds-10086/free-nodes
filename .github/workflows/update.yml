name: update-free-nodes

on:
  schedule:
    # 每 6 小时跑一次(UTC), 避开整点高峰
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-free-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 去重 + 测活
        run: python scripts/collect.py

      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output
          if git diff --staged --quiet; then
            echo "无变化, 跳过提交"
          else
            git commit -m "chore: update nodes $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
